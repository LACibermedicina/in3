  <text x="120" y="228" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#0B2026">IN&#179;</text>
  <text x="120" y="250" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="12" letter-spacing="2" fill="#3E6B63">M3D.PRO · INCUBADORA</text>
